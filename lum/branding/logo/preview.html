<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>lum — logo preview</title>
<link rel="icon" href="lum-favicon.svg" type="image/svg+xml">
<style>
  body { margin: 0; padding: 32px; font-family: system-ui, sans-serif; background: #e9e7e1; color: #12141f; }
  .row { display: flex; flex-wrap: wrap; gap: 16px; margin-bottom: 16px; }
  .cell { width: 200px; border-radius: 12px; padding: 20px; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; gap: 12px; }
  .cell span { font-size: 12px; }
  .dark { background: #0F1222; color: #c9cbd6; }
  .light { background: #F4F1EA; }
  .checker { background-color: #fff; background-image: repeating-conic-gradient(#d9d9d9 0 25%, transparent 0 50%); background-size: 16px 16px; }
  .sizes { display: flex; align-items: center; gap: 10px; }
</style>
</head>
<body>
<div class="row">
  <div class="cell dark"><img src="lum-mark.svg" width="140" height="140" alt=""><span>lum-mark.svg</span></div>
  <div class="cell checker"><img src="lum-mark.svg" width="140" height="140" alt=""><span>lum-mark.svg (transparent)</span></div>
  <div class="cell light"><img src="lum-mark-light-bg.svg" width="140" height="140" alt=""><span>lum-mark-light-bg.svg</span></div>
  <div class="cell checker"><img src="lum-mark-round.svg" width="140" height="140" alt=""><span>lum-mark-round.svg</span></div>
  <div class="cell checker"><img src="lum-mark-round-inverted.svg" width="140" height="140" alt=""><span>lum-mark-round-inverted.svg</span></div>
  <div class="cell dark"><img src="lum-mark-round-inverted.svg" width="140" height="140" alt=""><span>inverted on dark</span></div>
</div>
<div class="row">
  <div class="cell dark"><div class="sizes"><img src="lum-mark.svg" width="64" alt=""><img src="lum-mark.svg" width="32" alt=""><img src="lum-mark.svg" width="16" alt=""></div><span>small sizes</span></div>
  <div class="cell light"><div class="sizes"><img src="lum-mark-light-bg.svg" width="64" alt=""><img src="lum-mark-light-bg.svg" width="32" alt=""><img src="lum-mark-light-bg.svg" width="16" alt=""></div><span>small sizes</span></div>
  <div class="cell light"><div class="sizes"><img src="lum-mark-round.svg" width="64" alt=""><img src="lum-mark-round.svg" width="32" alt=""><img src="lum-favicon.svg" width="16" alt=""></div><span>round + favicon 16 px</span></div>
  <div class="cell dark"><div class="sizes"><img src="lum-mark-round-inverted.svg" width="64" alt=""><img src="lum-mark-round-inverted.svg" width="32" alt=""><img src="lum-favicon-inverted.svg" width="16" alt=""></div><span>inverted + favicon 16 px</span></div>
</div>
</body>
</html>
